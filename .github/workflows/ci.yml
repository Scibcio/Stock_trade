# CI - test suite on every push/PR (torch deliberately excluded: the live path
# is XGB-only (F6); model_lstm tests skip themselves when torch is absent).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true          # advisory for now; tighten once pins settle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
